# Builds the Starwake modpack (pack/) on every change, boots a real client with it, and publishes a GitHub
# release (tag pack-v<version>) with the Prism/Modrinth .mrpack and a dedicated-server zip.
name: modpack

on:
  push:
    paths:
      - 'pack/**'
      - 'tools/pack_*.py'
      - '.github/workflows/pack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Pack version
        id: meta
        run: echo "version=$(python3 -c "import tomllib;print(tomllib.load(open('pack/pack.toml','rb'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Check the index is up to date
        working-directory: pack
        run: |
          ~/go/bin/packwiz refresh
          git diff --exit-code -- index.toml pack.toml || (echo "Run 'packwiz refresh' in pack/ and commit index.toml" && exit 1)

      - name: Export .mrpack
        working-directory: pack
        run: ~/go/bin/packwiz modrinth export -o "../Starwake-${{ steps.meta.outputs.version }}.mrpack"

      - name: Build server pack
        run: |
          python3 tools/pack_server.py server
          (cd server && zip -qr "../Starwake-${{ steps.meta.outputs.version }}-server.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: starwake-pack
          path: |
            Starwake-*.mrpack
            Starwake-*-server.zip
          if-no-files-found: error

  client-test:
    # Starts a real NeoForge client with every mod of the pack, joins a singleplayer world and quits.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Stage the pack's client mods and overrides
        run: |
          python3 tools/pack_server.py run --client
          ls run/mods | wc -l

      - name: Run the client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: 1.21.1
          modloader: neoforge
          regex: .*neoforge.*
          mc-runtime-test: neoforge
          java: 21
          headlessmc-command: '--jvm "-Djava.awt.headless=true -Xmx6G"'

  release:
    needs: [build, client-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: starwake-pack

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pack-v${{ needs.build.outputs.version }}
          name: Starwake ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: pack/README.md
          files: |
            Starwake-*.mrpack
            Starwake-*-server.zip
          fail_on_unmatched_files: true
