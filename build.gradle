plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds Mojang + Fabric repositories automatically.
	// Add third-party mod repositories here when we depend on them (e.g. Fantasy in M5).
}

loom {
	// Separate client-only code into src/client so the server never loads it.
	splitEnvironmentSourceSets()

	mods {
		"starwake" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

fabricApi {
	// Adds the runDatagen task. client = true because model generation needs client classes;
	// output goes to src/main/generated, which Loom adds as a resource directory.
	configureDataGeneration {
		client = true
	}
}
